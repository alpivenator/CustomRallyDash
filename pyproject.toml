[project]
name = "custom-rally-dash"
version = "0.1.0"
description = "Custom real-time telemetry dashboard & overlay for DiRT Rally 2.0 (60 Hz UDP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Alperen (alpivenator)" }]
dependencies = ["pygame==2.6.1"]

[project.optional-dependencies]
pi = ["gpiozero==2.0.1"]

# Black tool configuration
[tool.black]
line-length = 90 # Maximum allowed line length
target-version = ['py311', 'py312', 'py313'] # Target Python version for code optimization

# Ruff tool configuration
[tool.ruff]
line-length = 90 # Keep Ruff's line limit consistent with Black
lint.select = ["E", "F", "I"] # E (Errors), F (Logic Errors), I (Import sorting rules)

# Pytest tool configuration
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
